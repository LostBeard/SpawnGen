# Publishes the Studio (Blazor WebAssembly, WebGPU engine in the page) to GitHub Pages: https://lostbeard.github.io/SpawnGen/
# Run it by hand (Actions > Deploy Studio to GitHub Pages > Run workflow). The default is the AOT build (13 min on 2026-11-27)
# but runs the host maths much faster; untick "aot" for a quick interpreter build.
name: Deploy Studio to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      aot:
        description: 'AOT compile (slow build, fast runtime)'
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install .NET WASM Build Tools
        if: ${{ inputs.aot }}
        run: dotnet workload install wasm-tools
      # The AOT publish can outgrow the runner's 16 GB at its peak (parallel clang -O2 on the big .bc files, wasm-opt). 2026-11-27: three of
      # four SpawnDev.ILGPU.ML demo deploys died there with "MSB4166: Child node exited prematurely" (OOM kill, no log kept; Tuvok's fix in
      # ML 7cdf50c8). Extra swap lets the peak through at full optimization; the sampler prints memory every 30 s so the peak is on record.
      - name: Add swap for the AOT peak
        if: ${{ inputs.aot }}
        run: |
          free -m
          sudo fallocate -l 16G /mnt/aot.swap
          sudo chmod 600 /mnt/aot.swap
          sudo mkswap /mnt/aot.swap
          sudo swapon /mnt/aot.swap
          free -m
          df -h /mnt .
      - name: Publish the Studio
        run: |
          ( while sleep 30; do echo "[mem] $(date +%T) $(free -m | awk '/Mem:/{printf "used %d/%d MB", $3, $2} /Swap:/{printf ", swap %d MB", $3}')  top: $(ps -eo rss=,comm= --sort=-rss | head -3 | awk '{printf "%s %d MB; ", $2, $1/1024}')"; done ) &
          sampler=$!
          dotnet publish src/SpawnGen.Studio -c Release --nologo -p:StudioAot=${{ inputs.aot }} --output out
          status=$?
          kill $sampler
          exit $status
      - name: Make the build work under /SpawnGen/
        run: |
          cd out/wwwroot
          sed -i 's|<base href="/" />|<base href="/SpawnGen/" />|' index.html
          cp index.html 404.html   # deep links come back to the app
          touch .nojekyll          # Jekyll would drop the _framework folder
          du -sh .
          # GitHub Pages refuses files over 100 MB and gzips what it serves by itself: a file over 95 MB (the AOT runtime, some builds)
          # ships as its .gz copy only and is listed in gzboot.json, which index.html reads; every other file ships once, as it is.
          bash ../../tools/gzboot.sh . over 95
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
