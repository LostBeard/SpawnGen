<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SpawnGen Studio</title>
    <base href="/" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="boot">Loading SpawnGen Studio...</div>
    </div>
    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">x</span>
    </div>
    <script>
        // Lets files be dropped on the editor: they go to the page (OnFileDropped) as bytes.
        window.spawngenEnableDrop = function (dotnetRef, selector) {
            const el = document.querySelector(selector);
            el.addEventListener("dragover", e => e.preventDefault());
            el.addEventListener("drop", async e => {
                e.preventDefault();
                for (const f of e.dataTransfer.files)
                    await dotnetRef.invokeMethodAsync("OnFileDropped", f.name, new Uint8Array(await f.arrayBuffer()));
            });
        };
        // Browser storage for the open workflows (tabs, autosave). It can be missing or full: every call is allowed to fail quietly.
        window.spawngenStoreGet = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
        window.spawngenStoreSet = function (key, value) { try { localStorage.setItem(key, value); return true; } catch (e) { return false; } };
        // Saves a picture (a data or same-origin URL) as a file download.
        window.spawngenDownloadUrl = function (name, url) {
            const a = document.createElement("a");
            a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        };
        // Saves text as a file download (the workflow JSON).
        window.spawngenDownload = function (name, text) {
            const url = URL.createObjectURL(new Blob([text], { type: "application/json" }));
            const a = document.createElement("a");
            a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
